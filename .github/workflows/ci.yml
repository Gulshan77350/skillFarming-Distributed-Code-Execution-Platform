name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'services/plagiarism-service/package-lock.json'

    - name: Install Plagiarism Service Dependencies
      run: |
        cd services/plagiarism-service
        npm ci

    - name: Run Plagiarism Service Unit Tests
      run: |
        cd services/plagiarism-service
        npm test
